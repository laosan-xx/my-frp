name: Sync frp version and branches

on:
  schedule:
    - cron: '0 6,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # laosan-xx/frp 已私有：所有访问该仓库的步骤都需要带读取权限的 PAT
      FRP_PAT: ${{ secrets.FRP_PAT }}
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest release tag from laosan-xx/frp
        id: upstream
        run: |
          # laosan-xx/frp 已设为私有仓库：匿名 API 会 404，必须用 FRP_PAT 鉴权
          if [ -z "$FRP_PAT" ]; then
            echo "ERROR: FRP_PAT is empty, cannot read private repo laosan-xx/frp!"
            echo "请在仓库 Settings → Secrets and variables → Actions 中添加 FRP_PAT（需有 laosan-xx/frp 读取权限）"
            exit 1
          fi

          TAG=$(curl -fsSL \
            -H "Authorization: Bearer $FRP_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/laosan-xx/frp/releases/latest" | jq -r '.tag_name')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to get upstream release tag"
            exit 1
          fi

          # Strip leading 'v' to get plain version (e.g. 0.70.8)
          PKG_VERSION="${TAG#v}"
          echo "Upstream tag: $TAG -> PKG_VERSION=$PKG_VERSION"

          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute PKG_HASH from upstream tarball
        id: hash
        run: |
          PKG_VERSION="${{ steps.upstream.outputs.PKG_VERSION }}"
          DOWNLOAD_OK=0

          # 方式一：codeload 直连（x-access-token 基础认证），与 Makefile PKG_SOURCE_URL 同源
          echo "Downloading: https://codeload.github.com/laosan-xx/frp/tar.gz/v${PKG_VERSION}"
          curl -fsSL --connect-timeout 20 --retry 5 \
            -u "x-access-token:$FRP_PAT" \
            "https://codeload.github.com/laosan-xx/frp/tar.gz/v${PKG_VERSION}" \
            -o frp.tar.gz && DOWNLOAD_OK=1

          # 方式二：GitHub API tarball（Bearer 认证）——仅当方式一失败时回退
          # 注意：API 生成的 tarball 与 codeload 的不是同一份字节，哈希以实际下载为准
          if [ "$DOWNLOAD_OK" -ne 1 ]; then
            echo "codeload failed, falling back to GitHub API tarball ..."
            curl -fsSL --connect-timeout 20 --retry 5 \
              -H "Authorization: Bearer $FRP_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/laosan-xx/frp/tarball/v${PKG_VERSION}" \
              -o frp.tar.gz && DOWNLOAD_OK=1
          fi

          if [ "$DOWNLOAD_OK" -ne 1 ] || [ ! -s frp.tar.gz ]; then
            rm -f frp.tar.gz
            echo "ERROR: failed to download laosan-xx/frp v${PKG_VERSION}, please check FRP_PAT permission!"
            exit 1
          fi

          PKG_HASH=$(sha256sum frp.tar.gz | awk '{print $1}')
          rm -f frp.tar.gz
          echo "PKG_HASH=$PKG_HASH" >> "$GITHUB_OUTPUT"
          echo "Computed hash: $PKG_HASH"

      - name: Update Makefile
        id: update
        run: |
          CURRENT_VERSION=$(grep '^PKG_VERSION:=' Makefile | sed 's/PKG_VERSION:=//')
          CURRENT_HASH=$(grep '^PKG_HASH:=' Makefile | sed 's/PKG_HASH:=//')

          NEW_VERSION="${{ steps.upstream.outputs.PKG_VERSION }}"
          NEW_HASH="${{ steps.hash.outputs.PKG_HASH }}"

          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ] && [ "$CURRENT_HASH" = "$NEW_HASH" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date (v${CURRENT_VERSION})"
          else
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${NEW_VERSION}/" Makefile
            sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${NEW_HASH}/" Makefile
            # 确保文件以换行结尾，避免引入「末尾换行」这种隐藏改动，
            # 否则 cherry-pick 到其它分支时会因上下文不匹配而冲突
            [ -z "$(tail -c1 Makefile)" ] || echo >> Makefile
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Updated: v${CURRENT_VERSION} -> v${NEW_VERSION}"
          fi

      - name: Commit and push to main
        if: steps.update.outputs.updated == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Makefile
          git commit -m "chore: bump to v${{ steps.upstream.outputs.PKG_VERSION }}-1"
          git push origin main
          # 记下刚提交的 SHA，供后续 cherry-pick 使用
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          