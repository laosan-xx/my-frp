name: Sync frp version and branches

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest release tag from laosan-xx/frp
        id: upstream
        run: |
          TAG=$(curl -sS "https://api.github.com/repos/laosan-xx/frp/releases/latest" | jq -r '.tag_name')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to get upstream release tag"
            exit 1
          fi

          # Strip leading 'v' to get plain version (e.g. 0.70.8)
          PKG_VERSION="${TAG#v}"
          echo "Upstream tag: $TAG -> PKG_VERSION=$PKG_VERSION"

          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute PKG_HASH from upstream tarball
        id: hash
        run: |
          PKG_VERSION="${{ steps.upstream.outputs.PKG_VERSION }}"
          TARBALL_URL="https://codeload.github.com/laosan-xx/frp/tar.gz/v${PKG_VERSION}"
          echo "Downloading: $TARBALL_URL"
          curl -fsSL "$TARBALL_URL" -o frp.tar.gz
          PKG_HASH=$(sha256sum frp.tar.gz | awk '{print $1}')
          rm -f frp.tar.gz
          echo "PKG_HASH=$PKG_HASH" >> "$GITHUB_OUTPUT"
          echo "Computed hash: $PKG_HASH"

      - name: Update Makefile
        id: update
        run: |
          CURRENT_VERSION=$(grep '^PKG_VERSION:=' Makefile | sed 's/PKG_VERSION:=//')
          CURRENT_HASH=$(grep '^PKG_HASH:=' Makefile | sed 's/PKG_HASH:=//')

          NEW_VERSION="${{ steps.upstream.outputs.PKG_VERSION }}"
          NEW_HASH="${{ steps.hash.outputs.PKG_HASH }}"

          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ] && [ "$CURRENT_HASH" = "$NEW_HASH" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date (v${CURRENT_VERSION})"
          else
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${NEW_VERSION}/" Makefile
            sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${NEW_HASH}/" Makefile
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Updated: v${CURRENT_VERSION} -> v${NEW_VERSION}"
          fi

      - name: Commit and push to main
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Makefile
          git commit -m "chore: bump to v${{ steps.upstream.outputs.PKG_VERSION }}-1"
          git push origin main
