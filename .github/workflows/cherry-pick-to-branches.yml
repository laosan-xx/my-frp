name: Sync main Makefile to branches

on:
  # 允许被 sync-from-upstream.yml 在「确有更新」时直接调用
  workflow_call:
    inputs:
      commit_sha:
        description: "main 上触发同步的 commit SHA（仅用于日志/追踪）"
        required: false
        type: string
  # 保留手动/直接 push 触发作为兜底
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [second, yanglu]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Makefile from main to ${{ matrix.branch }}
        env:
          TARGET: ${{ matrix.branch }}
        run: |
          git config --global user.name 'laosan-xx'
          git config --global user.email 'xxhy1989@gmail.com'

          # 直接采用 main 上的 Makefile，避免依赖 cherry-pick 的祖先链
          git fetch origin main
          git checkout origin/main -- Makefile

          # 确保文件以换行结尾，保持各分支一致
          [ -z "$(tail -c1 Makefile)" ] || echo >> Makefile

          if git diff --quiet --cached Makefile && git diff --quiet Makefile; then
            echo "ℹ️ ${{ matrix.branch }} 的 Makefile 已与 main 一致，无需提交"
            exit 0
          fi

          git add Makefile
          MSG="chore: sync Makefile from main"
          if [ -n "${{ inputs.commit_sha }}" ]; then
            MSG="$MSG (main@${{ inputs.commit_sha }})"
          fi
          git commit -m "$MSG"
          git push origin "$TARGET"
          echo "✅ ${{ matrix.branch }} 已同步 main 的 Makefile"
